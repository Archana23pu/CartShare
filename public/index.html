<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CartShare | Shop Together</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="container py-4 py-md-5">
<section class="hero-card">
<div class="hero-copy">
<span class="brand-pill">🛒 CartShare</span>
<h1>Shop together.<br><span>Spend smarter.</span></h1>
<p>A collaborative shopping room for roommates, student groups, office teams and travel buddies.</p>
<div class="feature-row"><div>⚡ Real-time</div><div>📸 Product catalog</div><div>🧾 Audit receipt</div></div>
</div>
<div class="auth-card">
<div class="text-center mb-4"><div class="logo-mark">🛒</div><h2>Welcome to CartShare</h2><p class="muted">Enter your name to create or join a shopping room.</p></div>
<form id="loginForm">
<label class="form-label">Your name</label>
<input id="userName" class="form-control form-control-lg mb-3" maxlength="30" placeholder="e.g. Archana" required>
<button class="btn btn-primary btn-lg w-100" type="submit" name="action" value="create">Create a new room</button>
<div class="or-divider"><span>or join an existing room</span></div>
<input id="roomCode" class="form-control form-control-lg mb-2 text-uppercase" maxlength="6" placeholder="6-character room code">
<button class="btn btn-outline-primary btn-lg w-100" type="submit" name="action" value="join">Join room</button>
</form>
<div id="loginMessage" class="alert alert-danger d-none mt-3 mb-0"></div>
</div>
</section>
</main>
<script src="js/login.js"></script>
</body></html>
