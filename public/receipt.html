<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CartShare | Receipt</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="receipt-page"><main class="container py-4">
<div class="receipt-toolbar no-print"><a href="javascript:history.back()" class="btn btn-outline-secondary">← Back</a><button onclick="window.print()" class="btn btn-primary">🖨️ Print Receipt</button></div>
<article class="receipt-paper"><header class="receipt-header"><div><div class="brand-text">🛒 CartShare</div><p class="muted mb-0">Collaborative Shopping Receipt</p></div><div class="text-end"><strong id="receiptRoom"></strong><div id="receiptDate" class="small muted"></div></div></header><hr>
<section class="receipt-section"><h3>Participants</h3><div id="receiptMembers" class="member-chips"></div></section>
<section class="receipt-section"><h3>Items</h3><div id="receiptItems"></div></section>
<section class="totals-box"><div><span>Total units</span><strong id="receiptItemCount">0</strong></div><div><span>Subtotal</span><strong id="receiptSubtotal">₹0.00</strong></div><div class="grand-total"><span>Group Total</span><strong id="receiptTotal">₹0.00</strong></div></section>
<footer class="receipt-footer"><p>Generated by CartShare</p><small>Audit-ready summary of the shared cart at generation time.</small></footer></article></main>
<script src="js/receipt.js"></script></body></html>
